<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EDEX Educational Exhibition · IISJ</title>
  <meta name="description" content="Visitor review experience for the EDEX Educational Exhibition at IISJ.">
  <meta property="og:title" content="EDEX Educational Exhibition · IISJ">
  <meta property="og:description" content="Visitor review experience for the EDEX Educational Exhibition at IISJ.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-ink: #2b241e;
      --brand-muted: #5c5147;
      --brand-quiet: #6e6256;
      --brand-accent: #312922;
      --brand-gold: #b68928;
      --bg-image: none;
      --bg-zoom: 1;
      --bg-x: 0%;
      --bg-y: 0%;
      --bg-blur: 0px;
    }
    body {
      font-family: 'Plus Jakarta Sans', 'Outfit', system-ui, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      background-color: #dfd6c7;
      color: var(--brand-ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.5;
    }
    h1, h2, h3, h4, .font-display {
      font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    /* Warm parchment, stone-taupe & dotted architectural canvas */
    .kiosk-bg {
      background-color: #d8cebe;
      background-image:
        radial-gradient(ellipse 75% 65% at 72% 28%, rgba(252, 250, 246, 0.94) 0%, rgba(242, 236, 227, 0.72) 42%, rgba(212, 200, 184, 0.3) 78%, transparent 100%),
        radial-gradient(ellipse 65% 65% at 10% 10%, rgba(164, 150, 132, 0.42) 0%, transparent 65%),
        radial-gradient(ellipse 70% 60% at 88% 92%, rgba(176, 161, 140, 0.48) 0%, transparent 65%),
        radial-gradient(ellipse 55% 55% at 15% 88%, rgba(186, 173, 155, 0.42) 0%, transparent 60%);
    }

    .dot-grid-texture {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(49, 41, 34, 0.085) 1px, transparent 1px);
      background-size: 16px 16px;
      z-index: 1;
    }

    .dynamic-bg {
      position: fixed;
      inset: 0;
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      z-index: -1;
      transition: background-image 1.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s ease-out, filter 0.3s ease-out;
      transform: scale(var(--bg-zoom)) translate(var(--bg-x), var(--bg-y));
      filter: blur(var(--bg-blur));
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, rgba(246, 241, 233, 0.45) 0%, rgba(218, 207, 192, 0.78) 100%);
      z-index: 0;
    }

    @keyframes orb-drift-a {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(40px, 28px, 0) scale(1.05); }
    }
    @keyframes orb-drift-b {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-38px, -24px, 0) scale(1.06); }
    }
    .liquid-orb-warm {
      background: radial-gradient(circle, rgba(255, 252, 246, 0.65) 0%, rgba(235, 224, 206, 0.22) 50%, transparent 74%);
      animation: orb-drift-a 18s ease-in-out infinite;
    }
    .liquid-orb-cool {
      background: radial-gradient(circle, rgba(168, 154, 136, 0.28) 0%, rgba(196, 182, 162, 0.14) 48%, transparent 74%);
      animation: orb-drift-b 22s ease-in-out infinite;
    }

    /* Warm Stone & Frosted Ivory Liquid Glass Surfaces */
    .liquid-glass {
      background: linear-gradient(
        145deg,
        rgba(255, 253, 249, 0.82) 0%,
        rgba(246, 240, 231, 0.72) 52%,
        rgba(235, 227, 214, 0.78) 100%
      );
      backdrop-filter: blur(28px) saturate(140%);
      -webkit-backdrop-filter: blur(28px) saturate(140%);
      box-shadow:
        inset 0 1px 0 0 rgba(255, 255, 255, 0.92),
        inset 1px 0 0 0 rgba(255, 255, 255, 0.65),
        0 20px 54px -16px rgba(49, 41, 34, 0.14),
        0 0 0 1px rgba(49, 41, 34, 0.11);
      color: var(--brand-ink);
    }

    .liquid-glass-bar {
      background: linear-gradient(
        180deg,
        rgba(176, 163, 145, 0.34) 0%,
        rgba(196, 184, 166, 0.24) 100%
      );
      backdrop-filter: blur(24px) saturate(130%);
      -webkit-backdrop-filter: blur(24px) saturate(130%);
      box-shadow:
        inset 0 -1px 0 0 rgba(49, 41, 34, 0.10),
        0 8px 24px -12px rgba(49, 41, 34, 0.08);
      color: var(--brand-ink);
    }

    .liquid-glass-subtle {
      background: linear-gradient(
        150deg,
        rgba(255, 253, 249, 0.68) 0%,
        rgba(238, 231, 219, 0.56) 100%
      );
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
      box-shadow:
        inset 0 1px 0 0 rgba(255, 255, 255, 0.85),
        0 8px 22px -10px rgba(49, 41, 34, 0.10),
        0 0 0 1px rgba(49, 41, 34, 0.13);
      color: var(--brand-ink);
      transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1), background 180ms ease, box-shadow 180ms ease;
    }
    .liquid-glass-subtle:hover {
      background: linear-gradient(
        150deg,
        rgba(255, 254, 252, 0.90) 0%,
        rgba(246, 240, 231, 0.82) 100%
      );
      box-shadow:
        inset 0 1px 0 0 rgba(255, 255, 255, 0.98),
        0 12px 28px -10px rgba(49, 41, 34, 0.14),
        0 0 0 1px rgba(49, 41, 34, 0.22);
    }

    .liquid-glass-modal {
      background: linear-gradient(
        155deg,
        rgba(252, 249, 244, 0.97) 0%,
        rgba(241, 234, 223, 0.98) 100%
      );
      backdrop-filter: blur(36px) saturate(140%);
      -webkit-backdrop-filter: blur(36px) saturate(140%);
      box-shadow:
        inset 0 1px 0 0 rgba(255, 255, 255, 0.98),
        0 30px 80px -16px rgba(43, 36, 30, 0.24),
        0 0 0 1px rgba(49, 41, 34, 0.14);
      color: var(--brand-ink);
    }

    /* Deep Espresso Charcoal Primary CTA */
    .liquid-cta {
      background: linear-gradient(180deg, #3c322a 0%, #2b241e 100%);
      color: #f7f3ec;
      box-shadow:
        inset 0 1px 0 0 rgba(255, 255, 255, 0.18),
        0 14px 30px -10px rgba(43, 36, 30, 0.35),
        0 0 0 1px rgba(43, 36, 30, 0.9);
      transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 180ms ease, background 180ms ease;
    }
    .liquid-cta:hover {
      background: linear-gradient(180deg, #453a31 0%, #241e18 100%);
      box-shadow:
        inset 0 1px 0 0 rgba(255, 255, 255, 0.24),
        0 18px 36px -10px rgba(43, 36, 30, 0.44),
        0 0 0 1px rgba(43, 36, 30, 1);
    }

    /* Headline dual-tone warm espresso gradient */
    .editorial-gradient-text {
      background: linear-gradient(135deg, #2b241e 0%, #5c5147 65%, #786c60 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(20px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-fade-in-up {
      animation: fade-in-up 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in {
      animation: fade-in 0.45s ease-out forwards;
    }

    @keyframes shimmer {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .animate-shimmer {
      animation: shimmer 32s infinite linear;
    }

    @keyframes star-pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.28) rotate(5deg); }
      100% { transform: scale(1); }
    }
    .animate-star-pop {
      animation: star-pop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.27) forwards;
    }

    @keyframes loading-bar {
      0% { transform: scaleX(0); }
      100% { transform: scaleX(1); }
    }
    .animate-loading-bar {
      animation: loading-bar 15s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes glow-pulse {
      0%, 100% { filter: drop-shadow(0 2px 8px rgba(182, 137, 40, 0.25)); }
      50% { filter: drop-shadow(0 4px 14px rgba(182, 137, 40, 0.45)); }
    }
    .animate-glow-pulse {
      animation: glow-pulse 4s infinite ease-in-out;
    }

    @media (prefers-reduced-motion: reduce) {
      .liquid-orb-warm, .liquid-orb-cool, .animate-fade-in-up, .animate-fade-in, .animate-shimmer, .animate-glow-pulse {
        animation: none !important;
      }
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",

    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="kiosk-bg h-screen w-screen m-0 p-0 text-[#2b241e] relative overflow-hidden">
  <div class="dynamic-bg"></div>
  <div class="bg-overlay"></div>
  <div class="dot-grid-texture"></div>
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-[2]">
     <div class="liquid-orb-warm absolute -top-44 right-[-8%] w-[720px] h-[720px] rounded-full blur-[95px]"></div>
     <div class="liquid-orb-cool absolute -bottom-48 -left-24 w-[760px] h-[760px] rounded-full blur-[105px]"></div>
  </div>
  <div id="root" class="h-full w-full relative z-20"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
